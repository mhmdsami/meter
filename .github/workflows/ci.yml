name: Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix dashboard

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm --prefix dashboard run types

      - name: Build
        run: npm --prefix dashboard run build

  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --manifest-path collector/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path collector/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path collector/Cargo.toml

  menubar:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: swift build --package-path menubar

      - name: Test
        run: swift test --package-path menubar
