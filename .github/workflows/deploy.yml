name: Deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: meter-prod
  cancel-in-progress: false

defaults:
  run:
    working-directory: dashboard

jobs:
  changes:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Detect app changes
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          base=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --limit 50 \
            --json headSha --jq "[.[] | select(.headSha != \"$HEAD_SHA\")][0].headSha // \"\"")
          if [ -z "$base" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -C "$GITHUB_WORKSPACE" fetch --quiet origin "$base"
          if git -C "$GITHUB_WORKSPACE" diff --quiet "$base" "$HEAD_SHA" -- dashboard package.json package-lock.json; then
            echo "app=false" >> "$GITHUB_OUTPUT"
          else
            echo "app=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci

      - name: Check credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID variable."
            exit 1
          fi

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply meter --remote

      - name: Deploy to Cloudflare Workers
        run: npm run deploy
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.METER_URL }}

      - name: Smoke test
        run: npm run smoke
        env:
          SMOKE_URL: ${{ vars.METER_URL }}
